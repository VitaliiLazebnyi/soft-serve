# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: auto-merge

# Turns on squash auto-merge for pull requests the repository owner opens, so
# they merge on their own once every rule on main is met (required checks,
# CodeQL, resolved review threads, signed commits).
#
# Security notes:
# - pull_request_target runs this file as it is on main, never the copy in the
#   pull request, so a pull request cannot change what this job does.
# - The job never checks out or runs code from the pull request.
# - It only acts on pull requests opened by the owner from a branch of this
#   repository; pull requests from forks, Dependabot or anyone else are skipped.
#
# Needs the AUTOMERGE_TOKEN secret: a fine-grained personal access token of the
# owner for this repository only, with "Contents: read and write" and
# "Pull requests: read and write". GITHUB_TOKEN is not used because a merge it
# starts does not trigger the push workflows on main.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {} # the job uses AUTOMERGE_TOKEN, not GITHUB_TOKEN

jobs:
  enable:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The AUTOMERGE_TOKEN secret is not set."
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --squash
